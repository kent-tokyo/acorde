[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2026-0543", reason = "chrono 0.4.45 is transitive through lopdf, rmcp, and schemars; no safe upgrade is available yet. Revisit dependency replacements by 2027-02-17." },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
  "0BSD",
  "Apache-2.0",
  "BSD-3-Clause",
  "LGPL-2.1-or-later",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

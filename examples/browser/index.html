<!doctype html>
<meta charset="utf-8">
<title>acorde WASM browser contract fixture</title>
<main id="practice-host" tabindex="-1">
  <h1>acorde WASM browser contract fixture</h1>
  <p id="status">Loading…</p>
  <p>
    <input id="file" type="file" accept=".musicxml,.xml" aria-label="Load MusicXML">
    <button id="apply" type="button" disabled>Apply edited MusicXML</button>
    <button id="undo" type="button" disabled>Undo</button>
    <button id="redo" type="button" disabled>Redo</button>
    <button id="analyze" type="button" disabled>Analyze</button>
    <button id="export" type="button" disabled>Export MusicXML</button>
  </p>
  <p class="transport" aria-label="Score playback controls">
    <button id="rewind-score" type="button" disabled>Rewind</button>
    <button id="play-score" type="button" disabled>Play score</button>
    <button id="pause-score" type="button" disabled>Pause</button>
    <button id="stop-score" type="button" disabled>Stop</button>
    <output id="transport-status" aria-live="polite">Stopped</output>
    <label for="seek-position">Seek</label>
    <input id="seek-position" type="range" min="0" max="0" value="0" step="0.01"
      aria-label="Seek position in seconds" disabled>
    <label for="tempo">Tempo</label>
    <input id="tempo" type="range" min="50" max="200" value="100" step="1"
      aria-label="Playback tempo multiplier percentage">
    <output id="tempo-value" for="tempo">100%</output>
    <label for="count-in-beats">Count-in</label>
    <input id="count-in-beats" type="number" min="0" max="8" value="0" step="1"
      aria-label="Count-in beats">
    <label><input id="loop-score" type="checkbox"> Loop measure range</label>
    <label for="loop-start">Start</label>
    <input id="loop-start" type="number" min="1" value="1" step="1" aria-label="Loop start measure">
    <label for="loop-end">End</label>
    <input id="loop-end" type="number" min="1" value="1" step="1" aria-label="Loop end measure">
    <label><input id="metronome" type="checkbox"> Metronome</label>
    <output id="transport-position" aria-live="polite">0:00 · M1 B1</output>
  </p>
  <pre id="transport-trace" aria-live="polite" aria-label="Playback scheduling trace"></pre>
  <button id="play" type="button" disabled>Play selected note</button>
  <section id="score" aria-label="Rendered score" aria-describedby="score-description"></section>
  <p id="score-description" class="visually-hidden"></p>
  <label for="source">MusicXML source (editable)</label>
  <textarea id="source" rows="8" cols="90" spellcheck="false"></textarea>
  <pre id="analysis" aria-live="polite"></pre>
  <pre id="metadata"></pre>
</main>
<style>
  [data-note-addr] { cursor: pointer; }
  [data-note-addr].selected { outline: 2px solid #2563eb; }
  [data-note-addr].playing { outline: 3px solid #dc2626; }
  .transport { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
  #transport-status { min-width: 5rem; font-weight: 600; }
  #tempo { inline-size: 9rem; }
  #seek-position { inline-size: 9rem; }
  #count-in-beats { inline-size: 3.5rem; }
  #loop-start, #loop-end { inline-size: 3.5rem; }
  #tempo-value, #transport-position { min-width: 4.5rem; font-variant-numeric: tabular-nums; }
  #transport-trace { max-block-size: 10rem; overflow: auto; font-size: 0.75rem; }
  #play { margin-bottom: 1rem; }
  #source { display: block; max-width: 100%; margin: 0.5rem 0 1rem; font: 0.8rem monospace; }
  #analysis { max-height: 16rem; overflow: auto; }
  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
<script type="module">
  import init, {
    parse_musicxml,
    compute_layout_ex,
    render_score_svg_with_layout,
    render_score_svg_row,
    render_score_metadata,
    svg_contract_version,
    analyze_score,
    serialize_musicxml,
    to_playback_events_ex,
    compute_playback_position,
  } from "../../crates/wasm/pkg/acorde_wasm.js";

  const fixture = `<?xml version="1.0" encoding="UTF-8"?>
<score-partwise version="3.1"><part-list><score-part id="P1"><part-name>Fixture</part-name></score-part></part-list>
<part id="P1"><measure number="1"><attributes><divisions>1</divisions><key><fifths>0</fifths></key><time><beats>4</beats><beat-type>4</beat-type></time><clef><sign>G</sign><line>2</line></clef></attributes>
<note><pitch><step>C</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
<note><pitch><step>D</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
<note><pitch><step>E</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
<note><pitch><step>F</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
<barline location="left"><repeat direction="forward"/></barline></measure>
<measure number="2"><attributes><time><beats>3</beats><beat-type>4</beat-type></time></attributes>
<note><rest/><duration>1</duration><type>quarter</type></note>
<note><pitch><step>G</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
<note><pitch><step>A</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note></measure>
<measure number="3"><note><pitch><step>B</step><octave>5</octave></pitch><duration>1</duration><type>quarter</type></note>
<note><pitch><step>C</step><octave>6</octave></pitch><duration>1</duration><type>quarter</type></note>
<note><pitch><step>D</step><octave>6</octave></pitch><duration>1</duration><type>quarter</type></note>
<barline location="right"><repeat direction="backward"/></barline></measure></part></score-partwise>`;

  // The score schedule comes from WASM; this small host transport deliberately owns
  // Web Audio nodes, output device access, and all visual state. It only schedules a
  // short look-ahead window so an imported score cannot create an unbounded number of
  // browser audio nodes at once.
  class WebAudioTransport {
    constructor({ onStateChange, onActiveAddresses, onPositionChange, onTrace }) {
      this.onStateChange = onStateChange;
      this.onActiveAddresses = onActiveAddresses;
      this.onPositionChange = onPositionChange;
      this.onTrace = onTrace;
      this.context = null;
      this.events = [];
      this.nextEvent = 0;
      this.origin = 0;
      this.elapsed = 0;
      this.state = "stopped";
      this.timer = null;
      this.frame = null;
      this.countInTimer = null;
      this.generation = 0;
      this.voices = new Set();
      this.countInVoices = new Set();
      this.loop = false;
    }

    static validEvents(events) {
      return events.filter((event) =>
        Number.isFinite(event.time_secs) && event.time_secs >= 0
        && Number.isFinite(event.duration_secs) && event.duration_secs > 0
        && Number.isFinite(event.pitch_midi_cents)
        && Number.isFinite(event.velocity),
      ).sort((a, b) => a.time_secs - b.time_secs || a.pitch_midi_cents - b.pitch_midi_cents);
    }

    async play(events, countIn = null) {
      if (this.state === "playing" || this.state === "counting-in") return;
      this.installEvents(events);
      this.context ??= new AudioContext();
      await this.context.resume();
      if (this.elapsed === 0 && countIn?.beats > 0 && countIn.beatSecs > 0) {
        this.startCountIn(countIn);
        return;
      }
      this.nextEvent = this.events.findIndex((event) => event.time_secs + event.duration_secs > this.elapsed);
      if (this.nextEvent < 0) this.elapsed = 0;
      this.nextEvent = this.events.findIndex((event) => event.time_secs + event.duration_secs > this.elapsed);
      this.origin = this.context.currentTime - this.elapsed;
      this.state = "playing";
      this.generation += 1;
      this.trace("play", { event_count: this.events.length });
      this.onStateChange(this.state);
      this.schedule();
    }

    startCountIn({ beats, beatSecs }) {
      this.cancelScheduled();
      const generation = this.generation;
      const start = this.context.currentTime + 0.03;
      for (let beat = 0; beat < beats; beat += 1) {
        const oscillator = this.context.createOscillator();
        const gain = this.context.createGain();
        const at = start + beat * beatSecs;
        oscillator.type = "square";
        oscillator.frequency.setValueAtTime(beat === 0 ? 1760 : 1320, at);
        gain.gain.setValueAtTime(0.0001, at);
        gain.gain.exponentialRampToValueAtTime(0.07, at + 0.004);
        gain.gain.exponentialRampToValueAtTime(0.0001, at + 0.04);
        oscillator.connect(gain).connect(this.context.destination);
        const voice = { oscillator, generation };
        this.countInVoices.add(voice);
        oscillator.addEventListener("ended", () => this.countInVoices.delete(voice));
        oscillator.start(at);
        oscillator.stop(at + 0.05);
      }
      this.state = "counting-in";
      this.trace("count-in", { beats, beat_secs: Number(beatSecs.toFixed(3)) });
      this.onStateChange(this.state);
      this.onPositionChange(0);
      this.countInTimer = setTimeout(() => {
        this.countInTimer = null;
        if (this.generation !== generation || this.state !== "counting-in") return;
        this.origin = this.context.currentTime - this.elapsed;
        this.state = "playing";
        this.generation += 1;
        this.trace("count-in-complete");
        this.onStateChange(this.state);
        this.schedule();
      }, Math.ceil((beats * beatSecs + 0.03) * 1000));
    }

    installEvents(events) {
      this.events = WebAudioTransport.validEvents(events);
      if (!this.events.some((event) => !event.is_metronome)) {
        throw new Error("No sounding playback events are available");
      }
    }

    elapsedSeconds() {
      return this.state === "playing" && this.context
        ? Math.max(0, this.context.currentTime - this.origin)
        : this.elapsed;
    }

    durationSeconds() {
      return this.events.reduce(
        (latest, event) => Math.max(latest, event.time_secs + event.duration_secs),
        0,
      );
    }

    trace(kind, details = {}) {
      this.onTrace({
        kind,
        elapsed_secs: Number(this.elapsedSeconds().toFixed(3)),
        ...details,
      });
    }

    seek(seconds) {
      const duration = this.durationSeconds();
      if (duration <= 0) return;
      // Keep an exact end seek from immediately stopping and resetting to zero.
      const target = Math.min(
        Math.max(0, Number.isFinite(seconds) ? seconds : 0),
        Math.max(0, duration - 0.001),
      );
      const wasPlaying = this.state === "playing" && this.context;
      this.cancelScheduled();
      this.elapsed = target;
      this.nextEvent = this.events.findIndex((event) => event.time_secs + event.duration_secs > target);
      this.trace("seek", { target_secs: Number(target.toFixed(3)) });
      if (wasPlaying) {
        this.origin = this.context.currentTime - target;
        this.state = "playing";
        this.generation += 1;
        this.onStateChange(this.state);
        this.onPositionChange(target);
        this.schedule();
        return;
      }
      this.state = target > 0 ? "paused" : "stopped";
      this.onStateChange(this.state);
      this.onPositionChange(target);
    }

    restartAtMatchingEvent(events) {
      const previous = this.eventNearElapsed();
      this.cancelScheduled();
      this.installEvents(events);
      const replacement = previous && this.events.find((event) =>
        event.address === previous.address
        && event.pitch_midi_cents === previous.pitch_midi_cents
        && event.is_metronome === previous.is_metronome,
      );
      this.elapsed = replacement?.time_secs ?? 0;
      this.nextEvent = this.events.findIndex((event) => event.time_secs + event.duration_secs > this.elapsed);
      this.origin = this.context.currentTime - this.elapsed;
      this.state = "playing";
      this.generation += 1;
      this.trace("reschedule", { event_count: this.events.length });
      this.onStateChange(this.state);
      this.schedule();
    }

    eventNearElapsed() {
      const elapsed = this.elapsedSeconds();
      return this.events.find((event) => event.time_secs <= elapsed && elapsed < event.time_secs + event.duration_secs)
        ?? this.events.find((event) => event.time_secs >= elapsed)
        ?? null;
    }

    pause() {
      if ((this.state !== "playing" && this.state !== "counting-in") || !this.context) return;
      if (this.state === "playing") {
        this.elapsed = Math.max(0, this.context.currentTime - this.origin);
      }
      this.cancelScheduled();
      this.state = "paused";
      this.trace("pause");
      this.onStateChange(this.state);
    }

    stop() {
      this.cancelScheduled();
      this.elapsed = 0;
      this.nextEvent = 0;
      this.state = "stopped";
      this.trace("stop");
      this.onStateChange(this.state);
      this.onPositionChange(0);
    }

    rewind() {
      if (this.state === "counting-in") {
        this.cancelScheduled();
        this.elapsed = 0;
        this.nextEvent = 0;
        this.state = "paused";
        this.trace("rewind");
        this.onStateChange(this.state);
        this.onPositionChange(0);
        return;
      }
      if (this.state !== "playing" || !this.context) {
        this.elapsed = 0;
        this.nextEvent = 0;
        this.trace("rewind");
        this.onPositionChange(0);
        return;
      }
      this.cancelScheduled();
      this.elapsed = 0;
      this.nextEvent = 0;
      this.origin = this.context.currentTime;
      this.state = "playing";
      this.generation += 1;
      this.trace("rewind");
      this.onStateChange(this.state);
      this.onPositionChange(0);
      this.schedule();
    }

    cancelScheduled() {
      this.generation += 1;
      if (this.timer !== null) { clearTimeout(this.timer); this.timer = null; }
      if (this.frame !== null) { cancelAnimationFrame(this.frame); this.frame = null; }
      if (this.countInTimer !== null) { clearTimeout(this.countInTimer); this.countInTimer = null; }
      for (const voice of this.voices) {
        try { voice.oscillator.stop(); } catch (_) { /* already stopped */ }
      }
      this.voices.clear();
      for (const voice of this.countInVoices) {
        try { voice.oscillator.stop(); } catch (_) { /* already stopped */ }
      }
      this.countInVoices.clear();
      this.onActiveAddresses(new Set());
    }

    schedule() {
      if (this.state !== "playing" || !this.context) return;
      const now = this.context.currentTime;
      const horizon = now + 0.2;
      const generation = this.generation;
      while (this.nextEvent < this.events.length) {
        const event = this.events[this.nextEvent];
        const start = this.origin + event.time_secs;
        if (start > horizon) break;
        this.nextEvent += 1;
        if (start + event.duration_secs <= now) continue;
        this.scheduleVoice(event, Math.max(now + 0.005, start), generation);
      }
      if (this.nextEvent >= this.events.length && this.voices.size === 0) {
        if (this.loop) {
          this.trace("loop");
          this.elapsed = 0;
          this.nextEvent = 0;
          this.origin = this.context.currentTime;
          this.schedule();
        } else {
          this.stop();
        }
        return;
      }
      this.timer = setTimeout(() => this.schedule(), 25);
      this.ensureHighlightLoop();
    }

    scheduleVoice(event, start, generation) {
      const oscillator = this.context.createOscillator();
      const gain = this.context.createGain();
      const frequency = 440 * 2 ** ((event.pitch_midi_cents / 100 - 69) / 12);
      const volume = event.is_metronome
        ? Math.max(0.02, Math.min(0.08, (event.velocity / 127) * 0.08))
        : Math.max(0.005, Math.min(0.16, (event.velocity / 127) * 0.16));
      const end = event.is_metronome
        ? Math.min(this.origin + event.time_secs + event.duration_secs, start + 0.045)
        : this.origin + event.time_secs + event.duration_secs;
      oscillator.type = event.is_metronome ? "square" : "triangle";
      oscillator.frequency.setValueAtTime(frequency, start);
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(volume, start + 0.008);
      gain.gain.setValueAtTime(volume, Math.max(start + 0.008, end - 0.012));
      gain.gain.exponentialRampToValueAtTime(0.0001, end);
      oscillator.connect(gain).connect(this.context.destination);
      const voice = { oscillator, event, start, end, generation };
      this.voices.add(voice);
      this.trace("schedule", {
        source_address: event.address ?? null,
        starts_at_secs: Number(event.time_secs.toFixed(3)),
        duration_secs: Number(event.duration_secs.toFixed(3)),
        metronome: event.is_metronome,
      });
      oscillator.addEventListener("ended", () => {
        this.voices.delete(voice);
        if (this.generation === generation) this.refreshHighlights();
      });
      oscillator.start(start);
      oscillator.stop(Math.max(start + 0.01, end));
    }

    refreshHighlights() {
      if (!this.context) return;
      const now = this.context.currentTime;
      const addresses = new Set(
        [...this.voices]
          .filter((voice) => voice.start <= now && now < voice.end && voice.event.address)
          .map((voice) => voice.event.address),
      );
      this.onActiveAddresses(addresses);
    }

    ensureHighlightLoop() {
      if (this.frame !== null || this.state !== "playing") return;
      const tick = () => {
        if (this.state !== "playing") { this.frame = null; return; }
        this.refreshHighlights();
        this.onPositionChange(this.elapsedSeconds());
        this.frame = requestAnimationFrame(tick);
      };
      tick();
    }
  }

  try {
    await init();
    let score = parse_musicxml(fixture);
    let undoStack = [];
    let redoStack = [];
    const options = JSON.stringify({ width: 700, staff_size: 24, measures_per_system: 4, interactive: true });
    let selectedAddress = null;
    const tempo = document.querySelector("#tempo");
    const tempoValue = document.querySelector("#tempo-value");
    const countInBeats = document.querySelector("#count-in-beats");
    const loopScore = document.querySelector("#loop-score");
    const loopStart = document.querySelector("#loop-start");
    const loopEnd = document.querySelector("#loop-end");
    const metronome = document.querySelector("#metronome");
    const seekPosition = document.querySelector("#seek-position");
    const transportPosition = document.querySelector("#transport-position");
    const transportTrace = document.querySelector("#transport-trace");
    const traceEntries = [];
    let measureCount = 1;
    let lastPositionUpdate = Number.NEGATIVE_INFINITY;
    const playbackOptions = () => ({
      tempo_multiplier: Number(tempo.value) / 100,
      loop_region: loopScore.checked
        ? [Number(loopStart.value) - 1, Number(loopEnd.value) - 1]
        : null,
      metronome: metronome.checked ? {} : null,
    });
    const playbackOptionsJson = () => JSON.stringify(playbackOptions());
    const formatElapsed = (elapsed) => {
      const wholeSeconds = Math.max(0, Math.floor(elapsed));
      return `${Math.floor(wholeSeconds / 60)}:${String(wholeSeconds % 60).padStart(2, "0")}`;
    };
    const transportStatus = document.querySelector("#transport-status");
    const updatePlaybackControls = (state) => {
      document.querySelector("#rewind-score").disabled = state === "stopped";
      document.querySelector("#play-score").disabled = state === "playing" || state === "counting-in";
      document.querySelector("#pause-score").disabled = state !== "playing" && state !== "counting-in";
      document.querySelector("#stop-score").disabled = state === "stopped";
      const duration = transport.durationSeconds();
      seekPosition.disabled = duration <= 0;
      seekPosition.max = String(duration);
    };
    const transport = new WebAudioTransport({
      onStateChange: (state) => {
        transportStatus.value = state;
        transportStatus.textContent = state[0].toUpperCase() + state.slice(1);
        updatePlaybackControls(state);
      },
      onActiveAddresses: (addresses) => {
        document.querySelectorAll("#score [data-note-addr]").forEach((note) =>
          note.classList.toggle("playing", addresses.has(note.dataset.noteAddr)),
        );
      },
      onPositionChange: (elapsed) => {
        const duration = transport.durationSeconds();
        if (duration > 0 && document.activeElement !== seekPosition) {
          seekPosition.value = String(Math.min(elapsed, duration));
        }
        let musicalPosition = "";
        if (elapsed === 0 || elapsed < lastPositionUpdate || elapsed - lastPositionUpdate >= 0.1) {
          lastPositionUpdate = elapsed;
          const position = JSON.parse(compute_playback_position(score, playbackOptionsJson(), elapsed));
          if (position) {
            const beat = Number.isInteger(position.beat) ? position.beat + 1 : (position.beat + 1).toFixed(2);
            musicalPosition = ` · M${position.measure_index + 1} B${beat}`;
          }
        } else {
          musicalPosition = transportPosition.dataset.musicalPosition ?? "";
        }
        transportPosition.dataset.musicalPosition = musicalPosition;
        const label = `${formatElapsed(elapsed)}${musicalPosition}`;
        transportPosition.value = label;
        transportPosition.textContent = label;
      },
      onTrace: (entry) => {
        traceEntries.push(entry);
        if (traceEntries.length > 64) traceEntries.shift();
        transportTrace.textContent = traceEntries.map((value) => JSON.stringify(value)).join("\n");
      },
    });
    const mountValidatedSvg = (container, source) => {
      const parsed = new DOMParser().parseFromString(source, "image/svg+xml");
      if (parsed.querySelector("parsererror") || parsed.documentElement.localName !== "svg" ||
          parsed.documentElement.namespaceURI !== "http://www.w3.org/2000/svg") {
        throw new Error("SVG document validation failed");
      }
      const walker = parsed.createTreeWalker(parsed, NodeFilter.SHOW_ELEMENT);
      while (walker.nextNode()) {
        const element = walker.currentNode;
        if (element.localName === "script" || [...element.attributes].some((attribute) => {
          const name = attribute.name.toLowerCase();
          const value = attribute.value.trim().toLowerCase();
          return name.startsWith("on") ||
            ["href", "xlink:href"].includes(name) && value.startsWith("javascript:");
        })) {
          throw new Error("unsafe SVG content rejected");
        }
      }
      container.replaceChildren(document.importNode(parsed.documentElement, true));
    };
    const updateHistoryControls = () => {
      document.querySelector("#undo").disabled = undoStack.length === 0;
      document.querySelector("#redo").disabled = redoStack.length === 0;
    };
    const render = (nextScore) => {
      transport.stop();
      const layout = compute_layout_ex(nextScore, JSON.stringify({ measures_per_row: 4 }));
      const svg = render_score_svg_with_layout(nextScore, layout, options);
      const row = render_score_svg_row(nextScore, layout, 0, options);
      const metadata = JSON.parse(render_score_metadata(nextScore, layout, options));
      if (!svg.startsWith("<svg") || !row.startsWith("<svg") ||
          metadata.contract_version !== svg_contract_version() ||
          metadata.measure_count < 1 ||
          metadata.address_bounds.length !== metadata.note_count ||
          !Array.isArray(metadata.tablature_staves) ||
          !Array.isArray(metadata.note_semantics) ||
          metadata.note_semantics.length !== metadata.note_count ||
          !metadata.accessible_text) {
        throw new Error("contract output failed validation");
      }
      mountValidatedSvg(document.querySelector("#score"), row);
      measureCount = metadata.measure_count;
      for (const input of [loopStart, loopEnd]) {
        input.max = String(measureCount);
        input.value = String(Math.min(Math.max(Number(input.value) || 1, 1), measureCount));
      }
      if (Number(loopStart.value) > Number(loopEnd.value)) loopEnd.value = loopStart.value;
      const notes = document.querySelectorAll("#score [data-note-addr]");
      let selectedNote = null;
      const select = (element) => {
        selectedNote = element;
        selectedAddress = element.dataset.noteAddr;
        notes.forEach((note) => note.classList.toggle("selected", note === element));
        document.querySelector("#play").disabled = false;
        document.querySelector("#status").textContent = `PASS: selected ${selectedAddress}`;
      };
      notes.forEach((note) => {
        note.setAttribute("tabindex", "0");
        note.setAttribute("role", "button");
        note.addEventListener("click", () => select(note));
        note.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") { event.preventDefault(); select(note); }
        });
        note.addEventListener("mouseenter", () => note.setAttribute("data-hover", "true"));
        note.addEventListener("mouseleave", () => note.removeAttribute("data-hover"));
        if (note.dataset.noteAddr === selectedAddress) select(note);
      });
      document.querySelector("#score-description").textContent = metadata.accessible_text;
      document.querySelector("#metadata").textContent = JSON.stringify(metadata, null, 2);
      // Keep the editable host surface in MusicXML, never the internal score JSON.
      document.querySelector("#source").value = serialize_musicxml(nextScore);
      document.querySelector("#apply").disabled = false;
      document.querySelector("#analyze").disabled = false;
      document.querySelector("#export").disabled = false;
      updatePlaybackControls(transport.state);
      updateHistoryControls();
      document.querySelector("#status").textContent = `PASS: offline workflow ready (${notes.length} selectable notes)`;
    };
    const replaceScore = (nextScore, recordHistory = true) => {
      if (recordHistory) undoStack.push(score);
      score = nextScore;
      if (recordHistory) redoStack = [];
      render(score);
    };
    const countInOptions = () => {
      const beats = Math.min(8, Math.max(0, Number(countInBeats.value) || 0));
      countInBeats.value = String(beats);
      const startTempo = Number(JSON.parse(score).settings?.tempo_bpm) || 120;
      return { beats, beatSecs: 60 / (startTempo * Number(tempo.value) / 100) };
    };
    document.querySelector("#apply").addEventListener("click", () => {
      try { replaceScore(parse_musicxml(document.querySelector("#source").value)); }
      catch (error) { document.querySelector("#status").textContent = `FAIL: ${error}`; }
    });
    document.querySelector("#undo").addEventListener("click", () => {
      const previous = undoStack.pop();
      if (previous === undefined) return;
      redoStack.push(score); score = previous; render(score);
    });
    document.querySelector("#redo").addEventListener("click", () => {
      const next = redoStack.pop();
      if (next === undefined) return;
      undoStack.push(score); score = next; render(score);
    });
    document.querySelector("#analyze").addEventListener("click", () => {
      document.querySelector("#analysis").textContent = JSON.stringify(JSON.parse(analyze_score(score)), null, 2);
    });
    document.querySelector("#export").addEventListener("click", () => {
      const blob = new Blob([serialize_musicxml(score)], { type: "application/xml" });
      const link = document.createElement("a"); link.href = URL.createObjectURL(blob);
      link.download = "acorde-export.musicxml"; link.click(); URL.revokeObjectURL(link.href);
    });
    document.querySelector("#file").addEventListener("change", async (event) => {
      const file = event.target.files[0]; if (!file) return;
      try { replaceScore(parse_musicxml(await file.text())); }
      catch (error) { document.querySelector("#status").textContent = `FAIL: ${error}`; }
    });
    document.querySelector("#play-score").addEventListener("click", async () => {
      try {
        const events = JSON.parse(to_playback_events_ex(score, playbackOptionsJson()));
        await transport.play(events, countInOptions());
      } catch (error) {
        document.querySelector("#status").textContent = `FAIL: playback ${error}`;
        transport.stop();
      }
    });
    document.querySelector("#rewind-score").addEventListener("click", () => transport.rewind());
    document.querySelector("#pause-score").addEventListener("click", () => transport.pause());
    document.querySelector("#stop-score").addEventListener("click", () => transport.stop());
    seekPosition.addEventListener("change", () => transport.seek(Number(seekPosition.value)));
    const restartPlaybackSchedule = () => {
      if (transport.state !== "playing") return;
      try { transport.restartAtMatchingEvent(JSON.parse(to_playback_events_ex(score, playbackOptionsJson()))); }
      catch (error) { document.querySelector("#status").textContent = `FAIL: playback ${error}`; transport.stop(); }
    };
    loopScore.addEventListener("change", () => { transport.loop = loopScore.checked; restartPlaybackSchedule(); });
    for (const input of [loopStart, loopEnd]) {
      input.addEventListener("change", () => {
        const start = Math.min(Math.max(Number(loopStart.value) || 1, 1), measureCount);
        const end = Math.min(Math.max(Number(loopEnd.value) || 1, start), measureCount);
        loopStart.value = String(start);
        loopEnd.value = String(end);
        restartPlaybackSchedule();
      });
    }
    metronome.addEventListener("change", () => {
      restartPlaybackSchedule();
    });
    tempo.addEventListener("input", () => {
      const label = `${tempo.value}%`;
      tempoValue.value = label;
      tempoValue.textContent = label;
      restartPlaybackSchedule();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== " " || event.ctrlKey || event.metaKey || event.altKey) return;
      const tag = event.target instanceof Element ? event.target.localName : "";
      if (["input", "textarea", "select", "button"].includes(tag)) return;
      event.preventDefault();
      if (transport.state === "playing" || transport.state === "counting-in") {
        transport.pause();
      } else {
        document.querySelector("#play-score").click();
      }
    });
    document.querySelector("#play").addEventListener("click", () => {
      if (!selectedAddress) return;
      const noteIndex = [...document.querySelectorAll("#score [data-note-addr]")]
        .findIndex((note) => note.dataset.noteAddr === selectedAddress);
      const audio = new AudioContext(); const oscillator = audio.createOscillator();
      const gain = audio.createGain(); oscillator.frequency.value = 523.25 * Math.pow(2, noteIndex / 12);
      gain.gain.setValueAtTime(0.12, audio.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.35);
      oscillator.connect(gain).connect(audio.destination); oscillator.start();
      oscillator.stop(audio.currentTime + 0.35); oscillator.addEventListener("ended", () => audio.close());
    });
    document.querySelector("#source").value = fixture;
    render(score);
  } catch (error) {
    document.querySelector("#status").textContent = `FAIL: ${error}`;
    throw error;
  }
</script>

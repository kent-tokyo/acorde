name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

permissions:
  contents: read

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check tag version
        shell: bash
        run: |
          test "${GITHUB_REF_TYPE}" = "tag"
          tag_version="${GITHUB_REF_NAME#v}"
          workspace_version=$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)
          test -n "$tag_version"
          test "$tag_version" = "$workspace_version"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run locked all-feature tests
        run: cargo test --all-features --locked

      - name: Run locked all-target clippy
        run: cargo clippy --all-features --locked --all-targets -- -D warnings

      - name: Verify workspace packages
        run: cargo package --workspace --locked

  publish:
    name: Publish crates
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Publish workspace
        run: cargo publish --workspace --locked

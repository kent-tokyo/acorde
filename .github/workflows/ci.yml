name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  security:
    name: Dependency security and license checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-audit and cargo-deny
        run: |
          cargo install cargo-audit --version 0.22.1 --locked
          cargo install cargo-deny --version 0.19.9 --locked
      - name: Audit advisories
        run: cargo audit
      - name: Check advisories, licenses, sources, and dependency bans
        run: cargo deny check advisories licenses sources bans

  fuzz-smoke:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # nightly action
        with:
          toolchain: nightly-2026-05-22
      - name: Install cargo-fuzz
        # cargo-fuzz 0.13.1's locked dependency graph predates the pinned nightly.
        # Build the CLI with the runner's stable toolchain; fuzz targets still run on nightly.
        run: cargo +stable install cargo-fuzz --version 0.13.1 --locked
      - name: Run bounded parser fuzz targets
        working-directory: fuzz
        shell: bash
        run: |
          set -euo pipefail
          for target in musicxml midi abc mei mscz score_json; do
            cargo +nightly fuzz run --sanitizer address "$target" -- \
              -runs=100 -max_len=4096 -timeout=5 -rss_limit_mb=512
          done

  interoperability-contract:
    name: External interoperability contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate external-interoperability and print corpus contracts
        run: |
          python3 -B scripts/validate_interoperability_manifest.py
          python3 -B scripts/validate_print_corpus.py --check-only

  msrv:
    name: MSRV (Rust 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # pinned toolchain action
        with:
          toolchain: 1.88.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Check workspace at the declared MSRV
        run: cargo check --workspace --all-features --locked

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo test
        run: cargo test --all-features --locked

      - name: cargo clippy
        run: cargo clippy --all-features --locked --all-targets -- -D warnings

  io-feature-matrix:
    name: IO feature contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Test ABC and MSCZ without MEI
        run: cargo test -p acorde-io --features "abc mscz" --locked

  package:
    name: Package workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo package
        run: cargo package --workspace --locked

      - name: Record package provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-provenance
          cargo metadata --format-version 1 --locked > release-provenance/cargo-metadata.json
          rustc -Vv > release-provenance/rustc-version.txt
          sha256sum target/package/*.crate > release-provenance/crates.sha256

      - name: Upload package provenance
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acorde-package-provenance
          path: release-provenance/

  wasm:
    name: WASM build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: wasm-pack build
        run: wasm-pack build crates/wasm --target web

      - name: Build viewer profile and check exports
        shell: bash
        run: |
          wasm-pack build crates/wasm --target web --release \
            --out-dir ../../target/wasm-profiles/viewer \
            --no-default-features --features viewer
          declarations=target/wasm-profiles/viewer/acorde_wasm.d.ts
          for binding in parse_abc parse_mscz compute_beams detect_chord extract_chord_plan suggest_chord_plans arrange_from_chord_proposal arrange_with_drone render_score_svg render_print_page_svgs to_playback_events_ex serialize_mscz; do
            grep -q "^export function $binding(" "$declarations"
          done
          if grep -q '^export function parse_musicxml(' "$declarations"; then
            echo 'viewer unexpectedly exports MusicXML' >&2
            exit 1
          fi

      - name: Compare playback-only profile with full and viewer
        shell: bash
        run: |
          wasm-pack build crates/wasm --target web --release \
            --out-dir ../../target/wasm-profiles/full
          wasm-pack build crates/wasm --target web --release \
            --out-dir ../../target/wasm-profiles/playback-only \
            --no-default-features --features playback-only
          node scripts/check-wasm-playback-profile.mjs > target/wasm-playback-profile-report.json
          node -e 'const d=require("./target/wasm-playback-profile-report.json"); console.log(JSON.stringify({sizes:Object.fromEntries(Object.entries(d.profiles).map(([name, profile])=>[name, profile.size])), parity:d.parity}))'

      - name: Check opt-in OMR bindings for wasm32
        run: cargo check -p acorde-wasm --target wasm32-unknown-unknown --all-features --locked

      - name: Check WASM artifact budget
        shell: bash
        run: |
          size=$(stat -c%s crates/wasm/pkg/acorde_wasm_bg.wasm)
          echo "WASM bytes: $size"
          # The full web binding includes score I/O, physical print-page SVGs,
          # layout, analysis, and chord-plan extraction/proposals. The latter
          # measured 5,886,216 bytes locally. The explicit-drone export measured
          # 5,977,433 bytes in CI. The repeated print-direction lane adds
          # 1,189 bytes to the macOS WASM artifact. The 9/8 accompaniment
          # change measures 5,991,322 bytes on Linux. Independent MIDI voice
          # channels and safe reimport measure 6,000,733 bytes locally. Exact
          # direction beats and their MusicXML roundtrip measure 6,020,159 bytes
          # locally. Written grace playback measures 6,028,234 bytes on macOS,
          # 4,928 bytes above the pre-change build. Opt-in ornament realization
          # measures 6,033,188 bytes on macOS, 4,954 bytes above the grace build.
          # Written MusicXML metronome marks and SVG note glyphs measure
          # 6,058,136 bytes on macOS, 24,948 bytes above that build.
          # Common and cut meter symbols measure 6,066,488 bytes on macOS,
          # 8,352 bytes above the metronome build.
          # Cross-staff beam work measured 6,076,806 bytes on Linux. The additional
          # MusicXML timing/slur ordering and MuseScore loss diagnostics measured
          # 6,078,920 bytes on macOS. Opt-in shared-unison playback, rest pedal
          # controls, and noncontiguous-tie diagnostics measure 6,096,487 bytes
          # locally. Key-signature cancellations and inline changes measured
          # 6,111,598 bytes on Linux. Staff-wide MuseScore ottava conversion
          # and hairpin rendering measured 6,120,867 bytes on Linux. Retain
          # a narrow margin and a hard cap.
          test "$size" -le 6123000

  renderer-benchmark:
    name: Renderer performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Enforce benchmark budget
        run: cargo run --release -p acorde-render-svg --example benchmark

  wasm-browser:
    name: WASM browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2.2.0
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: wasm browser tests
        run: timeout 5m wasm-pack test --headless --chrome crates/wasm
      - name: Viewer browser tests
        run: timeout 5m wasm-pack test --headless --chrome crates/wasm --no-default-features --features viewer
      - name: Playback-only browser tests
        run: timeout 5m wasm-pack test --headless --chrome crates/wasm --no-default-features --features playback-only

  browser-matrix:
    name: Browser smoke (${{ matrix.browser }})
    # Playwright 1.55.0 does not install browsers on ubuntu-26.04.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web
      - name: Install Playwright and browsers
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Start fixture server
        run: python3 -m http.server 8000 > /tmp/acorde-browser-server.log 2>&1 &
      - name: Run browser contract smoke test
        run: npx playwright test examples/browser/smoke.spec.mjs --project=${{ matrix.browser }}
      - name: Upload rendered screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acorde-browser-${{ matrix.browser }}
          path: test-results/**/${{ matrix.browser }}.png

  browser-hidpi:
    name: Browser smoke (Chromium HiDPI)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Build WASM package
        run: wasm-pack build crates/wasm --target web
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Start fixture server
        run: python3 -m http.server 8000 > /tmp/acorde-browser-server.log 2>&1 &
      - name: Run HiDPI browser smoke test
        run: npx playwright test examples/browser/smoke.spec.mjs --project=chromium-hidpi
      - name: Upload HiDPI screenshot
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acorde-browser-chromium-hidpi
          path: test-results/**/chromium-hidpi.png

  browser-adapter-typecheck:
    name: Browser adapter typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Typecheck framework-neutral adapter
        run: npx --yes -p typescript@5.8.3 tsc --noEmit --target ES2022 --module ES2022 --moduleResolution bundler --strict --skipLibCheck examples/browser/acorde-adapter.ts

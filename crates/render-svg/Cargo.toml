[package]
name = "acorde-render-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/acorde-render-svg"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure-Rust/WASM SVG score renderer for acorde-core scores, driven by acorde-layout"
readme = "README.md"
keywords = ["music", "notation", "svg", "sheet-music", "wasm"]
categories = ["multimedia::audio", "rendering"]

[dependencies]
acorde-core = { path = "../core", version = "1.0.8" }
acorde-layout = { path = "../layout", version = "1.0.8" }
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
quick-xml = "0.41"
# musicxml dev-dep for the render_musicxml example/tests only — never part of the published
# library's dependency graph (acorde-render-svg itself stays I/O-free).
acorde-io = { path = "../io", version = "1.0.8" }

[package]
name = "acorde-render-svg"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/acorde-render-svg"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Pure-Rust/WASM SVG score renderer for acorde-core scores, driven by acorde-layout"
readme = "README.md"
keywords = ["music", "notation", "svg", "sheet-music", "wasm"]
categories = ["multimedia::audio", "rendering"]

[features]
default = []
# Caller-supplied font bytes; no filesystem, installed fonts, or browser measurement.
font-metrics = ["dep:rustybuzz", "dep:thiserror", "dep:roxmltree"]

[dependencies]
acorde-core = { path = "../core", version = "1.3.12" }
acorde-layout = { path = "../layout", version = "1.3.12" }
serde = { version = "1", features = ["derive"] }
rustybuzz = { version = "0.20.1", optional = true }
thiserror = { version = "2", optional = true }
roxmltree = { version = "0.21", optional = true }

[dev-dependencies]
quick-xml = "0.41"
serde_json = "1"
# musicxml dev-dep for the render_musicxml example/tests only — never part of the published
# library's dependency graph (acorde-render-svg itself stays I/O-free).
acorde-io = { path = "../io", version = "1.3.12", features = ["abc", "mscz"] }

[lints]
workspace = true

[[example]]
name = "measured_print"
required-features = ["font-metrics"]

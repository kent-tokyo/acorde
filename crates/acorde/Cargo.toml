[package]
name = "acorde"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/acorde"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Platform-agnostic music score library — umbrella crate re-exporting acorde-core, acorde-io, acorde-layout"
readme = "README.md"
keywords = ["music", "musicxml", "midi", "notation"]
categories = ["multimedia::audio"]

[features]
default = ["musicxml", "midi"]
musicxml = ["acorde-io/musicxml"]
midi = ["acorde-io/midi"]
abc = ["acorde-io/abc"]
mscz = ["acorde-io/mscz"]
mei = ["acorde-io/mei"]
soundfont = ["dep:acorde-soundfont"]

[dependencies]
acorde-core   = { path = "../core", version = "1.0.1" }
acorde-io     = { path = "../io", version = "1.0.1", default-features = false }
acorde-layout = { path = "../layout", version = "1.0.1" }
acorde-soundfont = { path = "../soundfont", version = "1.0.1", optional = true }

[package]
name = "acorde-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line score format converter built on acorde"
readme = "README.md"
keywords = ["music", "musicxml", "midi", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "acorde"
path = "src/main.rs"

[dependencies]
acorde-core = { path = "../core", version = "1.0.9" }
acorde-io   = { path = "../io", version = "1.0.9", features = ["abc", "mei", "mscz"] }
acorde-analysis = { path = "../analysis", version = "1.0.9" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

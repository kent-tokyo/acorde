[package]
name = "acorde-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Command-line score format converter built on acorde"
readme = "README.md"
keywords = ["music", "musicxml", "midi", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[[bin]]
name = "acorde"
path = "src/main.rs"

[dependencies]
acorde-core = { path = "../core", version = "2.0.1" }
acorde-io   = { path = "../io", version = "2.0.1", features = ["abc", "gp", "humdrum", "mei", "mscz", "pae"] }
acorde-analysis = { path = "../analysis", version = "2.0.1" }
acorde-layout = { path = "../layout", version = "2.0.1" }
acorde-render-svg = { path = "../render-svg", version = "2.0.1" }
acorde-omr = { path = "../omr", version = "2.0.1" }
acorde-soundfont = { path = "../soundfont", version = "2.0.1", features = ["full-sf2"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmcp = { version = "3.8", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std"] }
schemars = "1.2.3"

[dev-dependencies]
rmcp = { version = "3.8", features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["rt", "macros", "process", "io-util"] }
png = "0.18"
sha2 = "0.11"

[lints]
workspace = true

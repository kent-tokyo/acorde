[package]
name = "acorde-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the acorde music score library"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
# Keep PNG decoding and OMR proposal generation out of the browser-score baseline.
# Hosts that need it build explicitly with `--features omr`.
omr = ["dep:acorde-omr"]

[dependencies]
acorde-core   = { path = "../core", version = "1.2.19" }
acorde-io     = { path = "../io", version = "1.2.19", features = ["abc", "gp", "mscz", "mei"] }
acorde-layout = { path = "../layout", version = "1.2.19" }
acorde-omr    = { path = "../omr", version = "1.2.19", optional = true }
acorde-render-svg = { path = "../render-svg", version = "1.2.19" }
acorde-analysis = { path = "../analysis", version = "1.2.19" }
acorde-soundfont = { path = "../soundfont", version = "1.2.19" }
wasm-bindgen = "0.2"
serde        = "1"
serde_json   = "1"
# uuid pulls getrandom 0.4; enable wasm_js so it works on wasm32-unknown-unknown
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
png = "0.17"
wasm-bindgen-test = "0.3"

[lints]
workspace = true

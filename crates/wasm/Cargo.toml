[package]
name = "acorde-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the acorde music score library"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acorde-core   = { path = "../core", version = "0.62.0" }
acorde-io     = { path = "../io", version = "0.62.0", features = ["abc", "mscz", "mei"] }
acorde-layout = { path = "../layout", version = "0.62.0" }
acorde-render-svg = { path = "../render-svg", version = "0.62.0" }
acorde-analysis = { path = "../analysis", version = "0.62.0" }
wasm-bindgen = "0.2"
serde_json   = "1"
# uuid pulls getrandom 0.4; enable wasm_js so it works on wasm32-unknown-unknown
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

[package]
name = "acorde-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the acorde music score library"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["full"]
# The default preserves the existing browser API. Opt into the smaller viewer with
# `--no-default-features --features viewer`.
full = ["musicxml", "midi", "gp", "mei", "soundfont"]
viewer = []
# Minimal opt-in binding for original-image pages that only parse MSCZ and
# compute playback events. Build with --no-default-features --features playback-only.
playback-only = []
musicxml = ["acorde-io/musicxml"]
midi = ["acorde-io/midi"]
gp = ["acorde-io/gp"]
mei = ["acorde-io/mei"]
soundfont = ["dep:acorde-soundfont"]
# Keep PNG decoding and OMR proposal generation out of the browser-score baseline.
# Hosts that need it build explicitly with `--features omr`.
omr = ["dep:acorde-omr"]

[dependencies]
acorde-core   = { path = "../core", version = "1.3.8" }
acorde-io     = { path = "../io", version = "1.3.8", default-features = false, features = ["abc", "mscz"] }
acorde-layout = { path = "../layout", version = "1.3.8" }
acorde-omr    = { path = "../omr", version = "1.3.8", optional = true }
acorde-render-svg = { path = "../render-svg", version = "1.3.8" }
acorde-analysis = { path = "../analysis", version = "1.3.8" }
acorde-soundfont = { path = "../soundfont", version = "1.3.8", optional = true }
wasm-bindgen = "0.2"
serde        = "1"
serde_json   = "1"
# uuid pulls getrandom 0.4; enable wasm_js so it works on wasm32-unknown-unknown
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
png = "0.18"
wasm-bindgen-test = "0.3"

[lints]
workspace = true

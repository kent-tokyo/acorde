[package]
name = "acorde-wasm"
version.workspace = true
edition.workspace = true
homepage.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
acorde-core   = { path = "../core" }
acorde-io     = { path = "../io", features = ["abc", "mscz"] }
acorde-layout = { path = "../layout" }
wasm-bindgen = "0.2"
serde_json   = "1"
# uuid pulls getrandom 0.4; enable wasm_js so it works on wasm32-unknown-unknown
getrandom = { version = "0.4", features = ["wasm_js"] }

[dev-dependencies]
wasm-bindgen-test = "0.3"

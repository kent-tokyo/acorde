[package]
name = "acorde-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/acorde-io"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MusicXML / MIDI / ABC / MSCZ parsers and serializer for acorde-core"
readme = "README.md"
keywords = ["musicxml", "midi", "abc-notation", "music", "parser"]
categories = ["parser-implementations", "multimedia::encoding"]

[features]
default = ["musicxml", "midi"]
musicxml = ["dep:quick-xml", "dep:zip", "dep:flate2"]
midi = ["dep:midly"]
abc = []
mscz = ["dep:quick-xml", "dep:zip", "dep:flate2"]
mei = ["dep:quick-xml"]
# Guitar Pro 6/7/8 (.gpx/.gp) import.
gp = ["dep:quick-xml", "dep:zip", "dep:flate2"]

[dependencies]
acorde-core = { path = "../core", version = "1.3.7" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

quick-xml = { version = "0.41", optional = true }
zip       = { version = "9.1.0", optional = true, default-features = false, features = ["deflate-flate2"] }
flate2    = { version = "1", optional = true, default-features = false, features = ["rust_backend"] }
midly     = { version = "0.5",  optional = true }

[dev-dependencies]
serde_json = "1"
sha2 = "0.11"

[lints]
workspace = true

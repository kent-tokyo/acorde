[package]
name = "acorde-io"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/acorde-io"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "MusicXML / MIDI / ABC / MSCZ parsers and serializer for acorde-core"
readme = "README.md"
keywords = ["musicxml", "midi", "abc-notation", "music", "parser"]
categories = ["parser-implementations", "multimedia::encoding"]

[features]
default = ["musicxml", "midi"]
musicxml = ["dep:quick-xml", "dep:zip"]
midi = ["dep:midly"]
abc = []
mscz = ["dep:quick-xml", "dep:zip"]
mei = ["dep:quick-xml"]

[dependencies]
acorde-core = { path = "../core", version = "0.82.0" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"

quick-xml = { version = "0.41", optional = true }
zip       = { version = "2",    optional = true, default-features = false, features = ["deflate-miniz"] }
midly     = { version = "0.5",  optional = true }

[dev-dependencies]
serde_json = "1"

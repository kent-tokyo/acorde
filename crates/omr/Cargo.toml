[package]
name = "acorde-omr"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/acorde-omr"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Bounded, provider-neutral image analysis for Acorde OMR proposals"
readme = "README.md"
keywords = ["music", "notation", "omr", "sheet-music"]
categories = ["multimedia::images", "multimedia::audio"]

[dependencies]
acorde-core = { path = "../core", version = "1.3.4" }
png = "0.17"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[lints]
workspace = true

[dev-dependencies]
acorde-io = { path = "../io", version = "1.3.4", features = ["mscz"] }

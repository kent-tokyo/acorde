[package]
name = "acorde-pdf"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/acorde-pdf"
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Vector PDF export for acorde scores through the Harumi backend"
readme = "README.md"
keywords = ["music", "notation", "pdf", "sheet-music", "svg"]
categories = ["multimedia::audio", "rendering"]

[features]
measured-print = ["acorde-render-svg/font-metrics"]

[dependencies]
acorde-core = { path = "../core", version = "2.0.0" }
acorde-layout = { path = "../layout", version = "2.0.0" }
acorde-render-svg = { path = "../render-svg", version = "2.0.0" }
harumi = { version = "1.23.7", features = ["svg"] }
lyon_tessellation = "=1.0.23"
roxmltree = "0.21"
thiserror = "2"

[dev-dependencies]
acorde-io = { path = "../io", version = "2.0.0" }
serde_json = "1"

[lints]
workspace = true
